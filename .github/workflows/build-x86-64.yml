# =============================================================================
# lede (coolsnowwolf) x86-64 UEFI 固件云端编译
# 触发方式：push 到 master/main，或手动点 "Run workflow"
# 产物：bin/targets/x86/64/*.img.gz  （其中 *-combined-efi.img.gz 为 UEFI 镜像）
# =============================================================================
name: Build lede x86-64 (UEFI)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  # 北京时间每周五晚 24:00（= 周六凌晨 0 点）自动编译一次
  # 北京 = UTC+8，所以对应 UTC 每周五 16:00
  schedule:
    - cron: '0 16 * * 5'

# 同一分支只保留最新一次构建，避免并发挤占资源
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86-64:
    runs-on: ubuntu-latest
    # 需要写权限，才能创建/管理 GitHub Releases
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      # 1) 检出你的 fork 仓库（含你要提交进去的 custom/ 和本 workflow）
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 1b) 自动同步上游 coolsnowwolf/lede：把最新代码合并进来，再编译。
      #     只合并、不推送，保留你自己的 .github/ custom/ 文件，也避免重复触发。
      - name: Sync fork to upstream (coolsnowwolf/lede)
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git fetch --depth 1 https://github.com/coolsnowwolf/lede.git master
          git merge --ff-only FETCH_HEAD 2>/dev/null || git merge FETCH_HEAD || true
          echo "=== HEAD after sync: $(git rev-parse --short HEAD) ==="

      # 2) 腾磁盘 + 加 swap：lede 全量编译吃空间和内存，GitHub runner 默认较紧
      - name: Free disk space & add swap
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/lib/mono /opt/ghc /opt/hostedtoolcache || true
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && \
            sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h /
          free -h

      # 3) 安装构建依赖（新版 Ubuntu 24.04 没有 libncurses5-dev / python3-distutils，故用现名）
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext \
            git libncurses-dev libz-dev patch python3 unzip \
            zlib1g-dev libssl-dev flex bison

      # 4) 更新并安装 feeds（coolsnowwolf 的插件源，这一步最耗时/最占网速）
      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5) 用种子配置生成完整 .config（x86-64 + squashfs + LuCI）
      - name: Prepare .config
        run: |
          cp custom/x86-64-uefi.config .config
          make defconfig

      # 5b) 强制解决 libustream 冲突：只保留 mbedtls 版、关掉 openssl 版。
      #     因为 luci-ssl 依赖 libustream-mbedtls，且两者并存会造成 file clash
      - name: Fix libustream-ssl conflict (mbedtls only)
        run: |
          sed -i "s|^CONFIG_PACKAGE_libustream-openssl=y|# CONFIG_PACKAGE_libustream-openssl is not set|" .config 2>/dev/null || true
          sed -i "s|^# CONFIG_PACKAGE_libustream-mbedtls is not set|CONFIG_PACKAGE_libustream-mbedtls=y|" .config 2>/dev/null || true
          echo "--- libustream settings ---"
          grep -E "libustream" .config || true

      # 6) 把默认配置修改脚本放进 base-files 的 uci-defaults，
      #    这样烧录后「第一次开机即生效」：eth0=LAN，IP 192.168.5.1/24
      - name: Bake default LAN config (eth0=LAN, 192.168.5.1/24)
        run: |
          mkdir -p package/base-files/files/etc/uci-defaults
          cp custom/lan-default.sh package/base-files/files/etc/uci-defaults/99-lan-default.sh
          chmod +x package/base-files/files/etc/uci-defaults/99-lan-default.sh
          echo "--- copied uci-defaults ---"
          ls -l package/base-files/files/etc/uci-defaults/

      # 7) 把默认 root 密码设为 root/password（在 runner 上用 openssl 计算哈希，编进首启脚本）
      - name: Bake default root password (root/password)
        run: |
          PASSHASH=$(openssl passwd -1 -salt dshsalt 'password')
          echo "PASSHASH=$PASSHASH"
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-set-root-password.sh <<EOF
          #!/bin/sh
          # 首次开机把 root 密码设为 'password'
          sed -i "s|^root:[^:]*:|root:${PASSHASH}:|" /etc/shadow
          exit 0
          EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-set-root-password.sh
          echo "--- root password uci-defaults ---"
          cat package/base-files/files/etc/uci-defaults/99-set-root-password.sh

      # 8) 编译（V=s 打印详细日志，tee 存到 build.log 方便排错）
      - name: Build image
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log

      # 9) 列出产物
      - name: List artifacts
        run: |
          echo "=== find bin/targets ==="
          find bin/targets -type f | sort
          echo "=== build.log tail ==="
          tail -n 40 build.log || true

      # 10) 上传固件产物（*.img.gz 为 UEFI/整盘镜像）。即便编译失败也上传，以便拿 build.log 排错
      - name: Upload image
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lede-x86-64-uefi-images
          path: |
            bin/targets/x86/64/*.img.gz
            bin/targets/x86/64/*.img
            build.log
          if-no-files-found: warn
          # 只在 60 天内保留产物，超过自动删除（≈只留最近 2 个月的固件）
          retention-days: 60

      # 11) 计算发布标签（用日期，如 auto-2026-08-01）
      - name: Compute release date tag
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 12) 发布到 GitHub Releases（仅在编译成功时发布，把固件挂到 Releases 页）
      - name: Publish to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ steps.date.outputs.date }}
          name: lede x86-64 UEFI auto-${{ steps.date.outputs.date }}
          files: |
            bin/targets/x86/64/*-combined-efi.img.gz
            bin/targets/x86/64/*.img.gz
          generate_release_notes: true

      # 13) 只保留最近 3 个固件（更早的旧 Release 自动删除）
      - name: Keep only latest 3 releases
        if: success()
        run: |
          # 列出所有 auto-* 版本，按日期倒序（新的在前），保留前 3 个，删除更早的
          gh release list --limit 100 | awk '{print $1}' | grep '^auto-' | sort -r > /tmp/autoreleases.txt
          echo "=== auto releases (newest first) ==="
          cat /tmp/autoreleases.txt
          # 从第 4 行起到最后，都是要删的旧版本（前面 3 个保留）
          tail -n +4 /tmp/autoreleases.txt | while read -r tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes || true
          done
          echo "=== done: kept latest 3 ==="
